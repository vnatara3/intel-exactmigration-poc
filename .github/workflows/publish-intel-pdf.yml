name: Publish Intel PDF

on:
  workflow_dispatch:
    inputs:
      publication_guid:
        description: "Publication GUID"
        required: true
        default: "GUID-28583781-F7EB-4F72-A734-AC8FA94C9D9C"
        type: string
      publication_ref:
        description: "Git branch, tag, or commit containing the publication"
        required: true
        default: "migration/GUID-28583781-NVL-20261117-081840"
        type: string
      root_map:
        description: "Root .ditamap relative to publication root; blank means auto-detect"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: intelbasepdf-${{ inputs.publication_guid }}
  cancel-in-progress: false

jobs:
  publish-intel-pdf:
    name: Publish IntelBasePDF
    runs-on: [self-hosted, Windows, X64, ipix-publishing, intelbasepdf]
    timeout-minutes: 45

    env:
      PUBLISHING_APP: E:\IPIX\Publishing\App
      PYTHON_EXE: E:\IPIX\Publishing\App\.venv\Scripts\python.exe
      PUBLISHING_JOBS: E:\IPIX\Publishing\Jobs
      PIPELINE_SOURCES: E:\IPIX\Publishing\PipelineSources
      PIPELINE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate workflow inputs
        shell: powershell
        run: |
          $guid = '${{ inputs.publication_guid }}'.Trim()
          if ($guid -notmatch '^GUID-[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$') {
            throw "Invalid publication GUID: $guid"
          }
          if ([string]::IsNullOrWhiteSpace('${{ inputs.publication_ref }}')) {
            throw 'publication_ref cannot be empty.'
          }

      - name: Checkout publication content
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publication_ref }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Prune expired pipeline sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:PIPELINE_SOURCES | Out-Null
          $cutoff = (Get-Date).AddDays(-7)
          Get-ChildItem $env:PIPELINE_SOURCES -Directory |
            Where-Object { $_.LastWriteTime -lt $cutoff } |
            ForEach-Object {
              Write-Host "Removing expired pipeline source: $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force
            }

      - name: Publish IntelBasePDF
        id: publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $guid = '${{ inputs.publication_guid }}'.Trim()
          $rootMap = '${{ inputs.root_map }}'.Trim()
          $publicationRef = '${{ inputs.publication_ref }}'.Trim()
          $jobRoot = Join-Path $env:PUBLISHING_JOBS $guid

          $existingRuns = @{}
          if (Test-Path $jobRoot) {
            Get-ChildItem $jobRoot -Directory | ForEach-Object { $existingRuns[$_.FullName] = $true }
          }

          $arguments = @(
            (Join-Path $env:PUBLISHING_APP 'publish_cli.py'),
            '--guid', $guid,
            '--source', $env:GITHUB_WORKSPACE,
            '--run-id', $env:PIPELINE_RUN_ID,
            '--pipeline-root', $env:PIPELINE_SOURCES,
            '--branch', $publicationRef,
            '--format', 'intelBasePDF'
          )
          if ($rootMap) { $arguments += @('--root-map', $rootMap) }

          & $env:PYTHON_EXE @arguments
          if ($LASTEXITCODE -ne 0) { throw "publish_cli.py failed with exit code $LASTEXITCODE" }

          $newRun = Get-ChildItem $jobRoot -Directory |
            Where-Object { -not $existingRuns.ContainsKey($_.FullName) } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $newRun) { throw "No new publishing run was found under $jobRoot" }

          $pdfs = Get-ChildItem (Join-Path $newRun.FullName 'output') -Recurse -File -Filter '*.pdf'
          if (-not $pdfs) { throw "No PDF was generated under $($newRun.FullName)\output" }

          $artifactStage = Join-Path $env:RUNNER_TEMP "intelBasePDF-$guid"
          New-Item -ItemType Directory -Path $artifactStage -Force | Out-Null
          $pdfs | Copy-Item -Destination $artifactStage -Force
          foreach ($name in 'publish-summary.json','publish.log') {
            $path = Join-Path $newRun.FullName $name
            if (Test-Path $path) { Copy-Item $path -Destination $artifactStage -Force }
          }

          "run_directory=$($newRun.FullName)" >> $env:GITHUB_OUTPUT
          "source_directory=$(Join-Path (Join-Path $env:PIPELINE_SOURCES $env:PIPELINE_RUN_ID) $guid)" >> $env:GITHUB_OUTPUT
          "artifact_path=$artifactStage" >> $env:GITHUB_OUTPUT
          "pdf_count=$($pdfs.Count)" >> $env:GITHUB_OUTPUT

          "## IntelBasePDF publishing succeeded" >> $env:GITHUB_STEP_SUMMARY
          "- Publication: ``$guid``" >> $env:GITHUB_STEP_SUMMARY
          "- Source ref: ``$publicationRef``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Pipeline source: ``$(Join-Path (Join-Path $env:PIPELINE_SOURCES $env:PIPELINE_RUN_ID) $guid)``" >> $env:GITHUB_STEP_SUMMARY
          "- PDF files: ``$($pdfs.Count)``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload IntelBasePDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: intelBasePDF-${{ inputs.publication_guid }}-${{ github.run_number }}
          path: ${{ steps.publish.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish completion summary
        shell: powershell
        run: |
          Write-Host "PDF count: ${{ steps.publish.outputs.pdf_count }}"
          Write-Host "Pipeline source: ${{ steps.publish.outputs.source_directory }}"
          Write-Host "Publishing run: ${{ steps.publish.outputs.run_directory }}"
